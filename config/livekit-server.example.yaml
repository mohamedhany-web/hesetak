# إعداد LiveKit المُوصى به لـ حصتك على VPS المخصص 187.127.87.170
# انسخ إلى /opt/livekit/livekit.yaml وعدّل المفاتيح فقط
port: 7880
bind_addresses:
  - "0.0.0.0"
log_level: info
prometheus_port: 6789

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  node_ip: 187.127.87.170
  packet_buffer_size_video: 1000
  packet_buffer_size_audio: 400
  congestion_control:
    enabled: true
    allow_pause: false
  interfaces:
    excludes:
      - docker0
      - br-+
      - veth+
  stun_servers:
    - stun.l.google.com:19302

turn:
  enabled: true
  domain: live.hissatak.online
  cert_file: /etc/livekit/certs/fullchain.pem
  key_file: /etc/livekit/certs/privkey.pem
  udp_port: 34789
  tls_port: 5351
  external_tls: false
  relay_range_start: 30000
  relay_range_end: 40000

room:
  empty_timeout: 300
  departure_timeout: 30
  enable_remote_unmute: true
  max_participants: 80

keys:
  YOUR_API_KEY: YOUR_API_SECRET
