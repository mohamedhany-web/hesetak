# إعداد LiveKit المُوصى به لـ حصتك على VPS 187.124.36.228
# انسخ إلى /opt/livekit/livekit.yaml وعدّل المفاتيح فقط
port: 7880
bind_addresses:
  - "0.0.0.0"
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # مع Docker host network: ثبّت IP العام ولا تكتشف واجهات docker
  use_external_ip: false
  node_ip: 187.124.36.228
  packet_buffer_size_video: 800
  packet_buffer_size_audio: 300
  congestion_control:
    enabled: true
    allow_pause: false
  interfaces:
    excludes:
      - docker0
      - br-+
      - veth+
  stun_servers:
    # لا تستخدم 3478 على هذا السيرفر — هو coturn الخاص بـ Jitsi/muallimx
    - stun.l.google.com:19302

# TURN مدمج — ضروري عندما UDP المباشر يتدهور بعد دقائق (شبكات مصر/موبايل)
# منافذ بديلة لتجنب تعارض coturn الخاص بـ Jitsi على 3478/5349
turn:
  enabled: true
  domain: live.glottical.com
  cert_file: /etc/livekit/certs/fullchain.pem
  key_file: /etc/livekit/certs/privkey.pem
  udp_port: 34789
  tls_port: 5351
  external_tls: true

# TURN relay يستخدم UDP 30000–40000 (يظهر في logs عند التشغيل)

room:
  empty_timeout: 300
  departure_timeout: 30
  enable_remote_unmute: true
  max_participants: 50

keys:
  YOUR_API_KEY: YOUR_API_SECRET
